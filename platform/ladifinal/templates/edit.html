{% extends 'base.html' %}
{% block content %}
<h3>Sửa Landing Page #{{landing.id}}</h3>
<form action="/api/landingpages/{{landing.id}}" method="post" enctype="multipart/form-data" class="mt-3" id="editForm">
  <input type="hidden" name="_method" value="PUT">
  <fieldset class="border rounded p-3 mb-3">
    <legend class="float-none w-auto px-2 small">Thông tin chung</legend>
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Loại giao diện</label>
        <input class="form-control" value="{{ 'Trang chủ' if landing.page_type=='homepage' else 'Ladipage' }}" disabled>
      </div>
      <div class="col-md-3">
        <label class="form-label">Subdomain</label>
        <input value="{{landing.subdomain}}" class="form-control" disabled>
      </div>
      <div class="col-md-3">
        <label class="form-label">Agent</label>
        <select name="agent" class="form-select">
          <option value="">-- Chọn Agent --</option>
          {% for a in agents_list %}
            <option value="{{a.name}}" {% if landing.agent == a.name %}selected{% endif %}>{{a.name}}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Google Form Link</label>
        <input name="google_form_link" class="form-control" value="{{landing.google_form_link}}" placeholder="https://docs.google.com/forms/...">
      </div>
      <div class="col-md-6">
        <label class="form-label">Cập nhật file ZIP (tùy chọn)</label>
        <input type="file" name="folder_zip" class="form-control" accept=".zip,application/zip">
        <small class="text-muted">Chỉ chọn khi muốn thay toàn bộ giao diện hiện tại bằng bản ZIP mới.</small>
      </div>
    </div>
  </fieldset>
  <fieldset class="border rounded p-3 mb-3">
    <legend class="float-none w-auto px-2 small">Analytics & Tracking</legend>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label"><i class="fab fa-facebook"></i> Facebook Pixel ID</label>
        <input name="fb_pixel_id" class="form-control" value="{{landing.fb_pixel_id or ''}}" placeholder="1234567890123456">
      </div>
      <div class="col-md-6">
        <label class="form-label"><i class="fab fa-tiktok"></i> TikTok Pixel ID</label>
        <input name="tiktok_pixel_id" class="form-control" value="{{landing.tiktok_pixel_id or ''}}" placeholder="XXXXXXXXXXXXXXXXXX">
      </div>
      <div class="col-md-4">
        <label class="form-label">Mã chuyển đổi Google Ads (AW)</label>
        <input name="google_ads_conversion_id" class="form-control" value="{{landing.google_ads_conversion_id or ''}}" placeholder="16590250699 hoặc AW-16590250699">
      </div>
      <div class="col-md-4">
        <label class="form-label">Nhãn chuyển đổi SĐT</label>
        <input name="google_ads_label_phone" class="form-control" value="{{landing.google_ads_label_phone or ''}}" placeholder="GoKSCL2gqoEcEMvF7OY9">
      </div>
      <div class="col-md-4">
        <label class="form-label">Nhãn chuyển đổi Zalo</label>
        <input name="google_ads_label_zalo" class="form-control" value="{{landing.google_ads_label_zalo or ''}}" placeholder="nuf0CMCgqoEcEMvF7OY9">
      </div>
      <div class="col-12">
        <label class="form-label">Global Site Tag (Legacy - Optional)</label>
        <textarea name="global_site_tag" class="form-control" rows="12" placeholder="<!-- Google tag (gtag.js) AW-XXXXXXXXXX -->">{{landing.global_site_tag}}</textarea>
        <small class="text-muted">Dành cho tracking code tùy chỉnh khác</small>
        {% include '_google_ads_conversion_guide.html' %}
      </div>
      <div class="col-md-4">
        <label class="form-label">Hotline Phone</label>
        <input name="hotline_phone" class="form-control" value="{{landing.hotline_phone}}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Zalo Phone</label>
        <input name="zalo_phone" class="form-control" value="{{landing.zalo_phone}}">
      </div>
    </div>
  </fieldset>
  
  <div class="mt-3">
    <button class="btn btn-primary">Cập nhật</button>
    <a href="/" class="btn btn-secondary">Hủy</a>
  </div>
</form>
<script>
  const form = document.getElementById('editForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    
    // Show loading overlay
    showLoading('Đang cập nhật...');
    
    try {
      const r = await fetch('/api/landingpages/{{landing.id}}', {method:'PUT', body: fd});
      if(r.ok){
        const result = await r.json();
        showSuccess(result.message || 'Cập nhật landing page thành công!');
        // Redirect after showing success message
        setTimeout(() => {
          window.location.href = '/admin-panel-xyz123/';
        }, 2000);
      } else {
        hideLoading();
        const j = await r.json().catch(()=>({error:'Lỗi không xác định'}));
        alert('Lỗi: ' + (j.error || 'Không thể cập nhật'));
      }
    } catch (error) {
      hideLoading();
      alert('Lỗi kết nối: ' + error.message);
    }
  })
</script>
{% endblock %}
